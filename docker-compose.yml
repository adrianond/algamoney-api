# spring-boot-docker/docker-compose.yml
version: "3.7"
services:
  redis:
    image: redis
    ports:
      - "6379:6379"
    networks:
      - redis_app_net
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
