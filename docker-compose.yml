  #    SPRING_RABBITMQ_PASSWORD: secret
  #  depends_on:
  #    - redis
  #    - rabbitmq
  #  networks:
  #    - redis_app_net
networks:
  redis_app_net:
    driver: bridge
volumes:
  rabbitmq_data: